name: CurrencyTel | Tests
on:
  workflow_dispatch:
  pull_request:
    paths: ['currencytel/**', 'tests/**', 'main.py', 'requirements*.txt', 'assets/js/**', '.github/workflows/**']
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check assets/js/app.js && node --check assets/js/data.js && node --check assets/js/chart.js && node --check assets/js/format.js
