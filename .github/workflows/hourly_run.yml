name: CurrencyTel | Fetch & publish
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'auto follows Tehran schedule; force publishing only with confirmation below'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - both
          - market
          - news
          - news-replay
          - instagram
      confirm_manual:
        description: 'I intentionally want to bypass schedule (never enable on cron-job.org)'
        required: false
        type: boolean
        default: false
  # Only the external cron-job.org dispatcher sends market_update every 5 minutes.
  # There is deliberately NO GitHub Actions cron/schedule trigger.
  repository_dispatch:
    types: [market_update]
permissions:
  contents: write
concurrency:
  group: currencytel-commit
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Select independent Tehran publishing slots
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TARGET: ${{ inputs.publish || 'auto' }}
          # Both web-button runs and cron-job.org API runs can be workflow_dispatch.
          # A force publish requires a second, explicit confirmation input.
          ALLOW_MANUAL_OVERRIDE: ${{ inputs.confirm_manual == true && '1' || '0' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$ALLOW_MANUAL_OVERRIDE" = "1" ] && [ "$MANUAL_TARGET" != "auto" ]; then
            echo "auto_scheduled=0" >> "$GITHUB_OUTPUT"
            # Only an explicitly confirmed manual run may bypass Tehran slots.
            case "$MANUAL_TARGET" in
              both|market)
                echo "market=1" >> "$GITHUB_OUTPUT"
                # Manual force is deliberately limited to domestic networks.
                # Telegram is ALWAYS restricted by the Tehran-time Python router.
                echo "market_targets=bale,rubika" >> "$GITHUB_OUTPUT"
                echo "news=$([ "$MANUAL_TARGET" = both ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
                echo "instagram=0" >> "$GITHUB_OUTPUT"
                ;;
              news|news-replay)
                echo "market=0" >> "$GITHUB_OUTPUT"
                echo "market_targets=none" >> "$GITHUB_OUTPUT"
                echo "news=1" >> "$GITHUB_OUTPUT"
                echo "instagram=0" >> "$GITHUB_OUTPUT"
                ;;
              instagram)
                echo "market=1" >> "$GITHUB_OUTPUT"
                echo "market_targets=none" >> "$GITHUB_OUTPUT"
                echo "news=0" >> "$GITHUB_OUTPUT"
                echo "instagram=1" >> "$GITHUB_OUTPUT"
                ;;
              *) echo "::error::Unknown manual target: $MANUAL_TARGET"; exit 1 ;;
            esac
            if [ "$MANUAL_TARGET" = news-replay ]; then
              echo "replay_latest=1" >> "$GITHUB_OUTPUT"
            else
              echo "replay_latest=0" >> "$GITHUB_OUTPUT"
            fi
          else
            # DEFAULT and all cron invocations obey the Python schedule,
            # whether cron-job.org uses workflow_dispatch or repository_dispatch.
            echo "auto_scheduled=1" >> "$GITHUB_OUTPUT"
            python -m currencytel.schedule
            echo "replay_latest=0" >> "$GITHUB_OUTPUT"
          fi
          echo "### Tehran publication slots" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(auto_scheduled|tick|market|market_targets|news|instagram|replay_latest)=' "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
      # Visibility only: no Telegram network request and no publishing decision.
      # This step runs even on 'news-only' ticks, when the market job is skipped.
      - name: Report Telegram status and next Tehran price slot
        if: always()
        env:
          ENABLE_TELEGRAM: ${{ vars.ENABLE_TELEGRAM || '0' }}
          AUTO_SCHEDULED: ${{ steps.slot.outputs.auto_scheduled || '0' }}
          MARKET: ${{ steps.slot.outputs.market || '0' }}
          MARKET_TARGETS: ${{ steps.slot.outputs.market_targets || 'none' }}
          SCHEDULED_TICK: ${{ steps.slot.outputs.tick || '' }}
        run: python -m currencytel.telegram_status
      - name: Check news and publish to enabled channels
        if: steps.slot.outputs.news == '1'
        env:
          ENABLE_BALE: ${{ vars.ENABLE_BALE || '0' }}
          ENABLE_RUBIKA: ${{ vars.ENABLE_RUBIKA || '0' }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID || vars.RUBIKA_CHAT_ID || '@currencytel' }}
          NEWS_REPLAY_LATEST: ${{ steps.slot.outputs.replay_latest || '0' }}
          REQUIRE_NEWS_PHOTO: '1'
        run: |
          python -m pip install 'requests>=2.32,<3' 'Pillow>=10.4,<13'
          python -c 'import logging; logging.basicConfig(level=logging.INFO, format="%(levelname)s | %(name)s | %(message)s"); from currencytel.news.pipeline import run_news; raise SystemExit(run_news())'
      - name: Install dependencies
        id: market_deps
        if: always() && steps.slot.outputs.market == '1'
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core >/dev/null
      - name: Run market collector and enabled publishers
        id: market_publish
        if: always() && steps.market_deps.outcome == 'success' && steps.slot.outputs.market == '1'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID || '@currencytel' }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID || vars.RUBIKA_CHAT_ID || '@currencytel' }}
          PUBLISH_ONLY: ${{ steps.slot.outputs.market_targets }}
          # Telegram hard guard in dispatch.py applies even to manual market runs.
          AUTO_SCHEDULED: ${{ steps.slot.outputs.auto_scheduled || '0' }}
          SCHEDULED_TICK: ${{ steps.slot.outputs.tick || '' }}
          ENABLE_TELEGRAM: ${{ vars.ENABLE_TELEGRAM || '0' }}
          ENABLE_BALE: ${{ vars.ENABLE_BALE || '0' }}
          ENABLE_RUBIKA: ${{ vars.ENABLE_RUBIKA || '0' }}
          GENERATE_INSTAGRAM_CARD: ${{ (steps.slot.outputs.instagram == '1' || vars.ENABLE_RUBINO == '1') && '1' || '0' }}
          PAGE_TIMEOUT: '13'
        run: python main.py
      # Instagram: publish ONLY with a previously saved session.
      # This does not call login, verify_login or authenticate.
      - name: Install Instagram upload dependencies
        id: instagram_deps
        if: always() && steps.market_publish.outcome == 'success' && steps.slot.outputs.instagram == '1'
        run: python -m pip install -r requirements-instagram.txt

      - name: Publish prepared Instagram card (saved session only)
        if: always() && steps.instagram_deps.outcome == 'success' && steps.market_publish.outcome == 'success' && steps.slot.outputs.instagram == '1'
        continue-on-error: true
        env:
          ENABLE_INSTAGRAM: ${{ vars.ENABLE_INSTAGRAM || '1' }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_MAX_DAILY_POSTS: '1'
          INSTAGRAM_MIN_HOURS: '0'
        run: python scripts/post_instagram.py

      # Rubino social post: optional step in the SAME market publishing workflow.
      # Separate from the Rubika channel bot; no login/SMS is attempted here.
      - name: Install Rubino publisher dependencies (opt-in)
        if: always() && steps.market_publish.outcome == 'success' && vars.ENABLE_RUBINO == '1'
        run: python -m pip install -r requirements-rubino.txt

      - name: Publish prepared CurrencyTel image to Rubino (saved session)
        if: always() && steps.market_publish.outcome == 'success' && vars.ENABLE_RUBINO == '1'
        continue-on-error: true
        env:
          ENABLE_RUBINO: ${{ vars.ENABLE_RUBINO || '0' }}
          RUBINO_PHONE: ${{ secrets.RUBINO_PHONE }}
          RUBINO_PAGE_ID: ${{ secrets.RUBINO_PAGE_ID }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          RUBINO_MAX_DAILY_POSTS: ${{ vars.RUBINO_MAX_DAILY_POSTS || '3' }}
          RUBINO_MIN_HOURS: ${{ vars.RUBINO_MIN_HOURS || '4' }}
        run: python scripts/post_rubino.py

      - name: Commit only generated public data and publishing state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/ market_log.txt
          if [ -d assets/generated ]; then
            git add -A -- assets/generated/
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update CurrencyTel data [skip ci]'
            git push
          fi
