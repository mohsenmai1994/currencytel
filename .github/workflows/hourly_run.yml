name: CurrencyTel | Fetch & publish
on:
  workflow_dispatch:
  repository_dispatch:
    types: [market_update]
permissions:
  contents: write
concurrency:
  group: currencytel-commit
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core >/dev/null
      - name: Run market collector and enabled publishers
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID || '@currencytel' }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHAT_ID: ${{ secrets.BALE_CHAT_ID }}
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID || vars.RUBIKA_CHAT_ID || '@currencytel' }}
          ENABLE_TELEGRAM: ${{ vars.ENABLE_TELEGRAM || '1' }}
          ENABLE_BALE: ${{ vars.ENABLE_BALE || '0' }}
          ENABLE_RUBIKA: ${{ vars.ENABLE_RUBIKA || '0' }}
          GENERATE_INSTAGRAM_CARD: ${{ vars.GENERATE_INSTAGRAM_CARD || '1' }}
          POST_UNCHANGED: ${{ vars.POST_UNCHANGED || '0' }}
          PAGE_TIMEOUT: '13'
        run: python main.py
      # Instagram: publish ONLY with a previously saved session.
      # This does not call login, verify_login or authenticate.
      - name: Install Instagram upload dependencies
        if: success()
        run: python -m pip install -r requirements-instagram.txt

      - name: Publish prepared Instagram card (saved session only)
        if: success()
        continue-on-error: true
        env:
          ENABLE_INSTAGRAM: ${{ vars.ENABLE_INSTAGRAM || '1' }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_MAX_DAILY_POSTS: ${{ vars.INSTAGRAM_MAX_DAILY_POSTS || '3' }}
          INSTAGRAM_MIN_HOURS: ${{ vars.INSTAGRAM_MIN_HOURS || '4' }}
        run: python scripts/post_instagram.py

      - name: Commit only generated public data and publishing state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/ market_log.txt
          if [ -d assets/generated ]; then
            git add -A -- assets/generated/
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update CurrencyTel market data [skip ci]'
            git push
          fi
