name: CurrencyTel | Instagram verification and posting
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - verify_login
          - publish
        default: verify_login
      verification_code:
        description: 'One-time Instagram email/SMS code (plain workflow input; use a temporary Secret instead for privacy)'
        required: false
        type: string
  repository_dispatch:
    types: [instagram_publish]
  workflow_run:
    workflows: ['CurrencyTel | Fetch & publish']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: currencytel-commit
  cancel-in-progress: false
jobs:
  instagram:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Instagram dependencies
        run: python -m pip install -r requirements-instagram.txt
      - name: Mask one-time verification code in logs
        # Workflow inputs are not GitHub Secrets. They can be visible in run
        # metadata. Prefer the optional temporary Secret on public repositories.
        env:
          OTP_INPUT: ${{ inputs.verification_code || '' }}
          OTP_SECRET: ${{ secrets.INSTAGRAM_ONE_TIME_CODE || '' }}
        run: |
          if [ -n "$OTP_INPUT" ]; then echo "::add-mask::$OTP_INPUT"; fi
          if [ -n "$OTP_SECRET" ]; then echo "::add-mask::$OTP_SECRET"; fi
      - name: Authenticate or publish Instagram photo
        env:
          ENABLE_INSTAGRAM: ${{ vars.ENABLE_INSTAGRAM || '0' }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_VERIFICATION_CODE: ${{ secrets.INSTAGRAM_ONE_TIME_CODE || inputs.verification_code || '' }}
          INSTAGRAM_AUTH_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'verify_login' && '1' || '0' }}
          INSTAGRAM_MAX_DAILY_POSTS: ${{ vars.INSTAGRAM_MAX_DAILY_POSTS || '3' }}
          INSTAGRAM_MIN_HOURS: ${{ vars.INSTAGRAM_MIN_HOURS || '4' }}
        run: python scripts/post_instagram.py
      - name: Persist encrypted session and posting state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch -- data/instagram_session.enc
          for file in .github/state/instagram_session.enc data/publish_state.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Persist encrypted Instagram session and posting receipt [skip ci]'
            git push
          fi
