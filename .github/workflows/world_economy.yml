name: Update world economy data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4,16 * * *'

permissions:
  contents: write

concurrency:
  group: currencytel-world-economy
  cancel-in-progress: false

jobs:
  update-world-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CurrencyTel repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect World Bank indicators and Frankfurter FX
        run: python scripts/build_world_economy.py
      - name: Commit refreshed GitHub data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/world-economy.json
          if git diff --cached --quiet; then
            echo 'No economic-data changes'
          else
            git commit -m 'data: update world economy GitHub feed'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
